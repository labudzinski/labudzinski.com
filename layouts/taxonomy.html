{{ define "main" }}
  {{ partial "masthead.html" . }}
  <h1>Tags</h1>
  <hr class="zine-rule zine-rule--solid">
  <ul class="menu-list">
    {{- range .Data.Terms.Alphabetical -}}
      <li><a href="{{ .Page.RelPermalink }}">Posts: {{ .Page.LinkTitle }}</a> <span class="meta">({{ .Count }})</span></li>
    {{- end -}}
  </ul>
  <hr class="zine-rule">
  {{ partial "back_link.html" . }}
{{ end }}
