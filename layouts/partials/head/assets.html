{{- $needsChroma := false -}}
{{- if .IsPage -}}
  {{- if findRE `<pre class="chroma">` .Content -}}
    {{- $needsChroma = true -}}
  {{- end -}}
{{- end -}}

{{- $cssV := substr (md5 (readFile "static/css/main.css")) 0 10 -}}
<link rel="stylesheet" href="/css/main.css?v={{ $cssV }}">
{{- if $needsChroma -}}
<link rel="stylesheet" href="/css/chroma.css?v={{ $cssV }}">
{{- end -}}
