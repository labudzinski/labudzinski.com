{{- $cmd := .cmd | default "ls" -}}
{{- $arg := .arg | default "" -}}
{{- $id := .id | default "" -}}
{{- $label := .label | default "" -}}
{{- $group := .group | default "section" -}}
<div class="terminal-cmd-group terminal-cmd-group--{{ $group }}">
  <div class="terminal-cmd-block">
    <p class="terminal-cmd" aria-hidden="true">
      <span class="terminal-cmd__prompt" aria-hidden="true"></span>
      {{- $cmd -}}
      {{- with $arg -}}
      <span class="terminal-cmd__arg"> {{ . }}</span>
      {{- end -}}
    </p>
    <div class="terminal-cmd__output terminal-cmd__output--section"{{ with $id }} id="{{ . }}"{{ end }}{{ with $label }} aria-label="{{ . }}"{{ end }}>
      {{- partial .partial .ctx -}}
    </div>
  </div>
</div>
