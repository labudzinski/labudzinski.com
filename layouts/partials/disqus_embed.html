<div
  id="disqus_thread"
  data-page-url="{{ .Permalink }}"
  data-page-identifier="{{ .RelPermalink }}"
  data-page-title="{{ .Title }}"
></div>
<noscript>
  <p class="comments__noscript">Enable JavaScript to view comments powered by <a href="https://disqus.com/?ref_noscript">Disqus</a>.</p>
</noscript>
<script>
  var disqus_config = function () {
    var el = document.getElementById('disqus_thread');
    this.page.url = el.getAttribute('data-page-url');
    this.page.identifier = el.getAttribute('data-page-identifier');
    this.page.title = el.getAttribute('data-page-title');
    this.language = 'pl';
  };
  (function () {
    var d = document, s = d.createElement('script');
    s.src = 'https://{{ site.Config.Services.Disqus.Shortname | default site.Params.disqusShortname }}.disqus.com/embed.js';
    s.setAttribute('data-timestamp', +new Date());
    (d.head || d.body).appendChild(s);
  })();
</script>
