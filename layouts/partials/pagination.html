{{- if gt .Paginator.TotalPages 1 -}}
<nav class="pagination" aria-label="Pagination">
  {{- if .Paginator.HasPrev -}}
  <a class="pagination__prev" href="{{ .Paginator.Prev.URL | relURL }}" rel="prev">« poprzednia</a>
  {{- end -}}
  <span class="pagination__status" aria-current="page">strona {{ .Paginator.PageNumber }} / {{ .Paginator.TotalPages }}</span>
  {{- if .Paginator.HasNext -}}
  <a class="pagination__next" href="{{ .Paginator.Next.URL | relURL }}" rel="next">następna »</a>
  {{- end -}}
</nav>
{{- end -}}
