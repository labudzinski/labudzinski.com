<header class="masthead">

      <span class="site-brand__mark" aria-hidden="true">DL</span>
      <span>{{ .Site.Title }}</span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" aria-label="Otwórz menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    {{ partial "site_nav.html" . }}
  </div>
</header>
