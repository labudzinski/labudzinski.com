{{- $id := "" -}}
{{- with site.Config.Services.GoogleAnalytics.ID -}}
  {{- $id = . -}}
{{- else -}}
  {{- $id = site.Params.googleAnalytics | default "" -}}
{{- end -}}

{{- if and $id (not hugo.IsServer) -}}
<meta name="ga-id" content="{{ $id }}">
<script defer src="/js/gtag-init.js?v={{ substr (md5 (readFile "static/js/gtag-init.js")) 0 10 }}"></script>
{{- end -}}
