<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}" dir="ltr">
<head>
  {{- partial "head.html" . -}}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="wrap">
    {{ partial "masthead.html" . }}
    <main id="main" tabindex="-1">
      {{- block "main" . }}{{- end }}
    </main>
    {{ partial "footer.html" . }}
  </div>
</body>
</html>
