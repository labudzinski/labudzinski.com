{{ define "main" }}
  <div class="terminal-cmd-group terminal-cmd-group--lead">
    <div class="terminal-cmd-block">
      <p class="terminal-cmd" aria-hidden="true">
        <span class="terminal-cmd__prompt" aria-hidden="true"></span>
        ls <h1 class="terminal-cmd__output">{{ .Title | lower }}</h1>
      </p>
    </div>
  </div>
  <hr class="zine-rule zine-rule--solid">
  <ul class="menu-list">
    {{- range .Pages -}}
      <li><a href="{{ .Permalink | relURL }}">{{ .Title }}</a></li>
    {{- end -}}
  </ul>
  {{ partial "page_footer.html" . }}
{{ end }}
