{{ define "main" }}
  <h1 class="visually-hidden">{{ .Title }}</h1>
  {{ partial "terminal_section.html" (dict
      "cmd" "ls"
      "arg" (printf "/%s/" (.Title | urlize))
      "label" .Title
      "partial" "page_list.html"
      "ctx" .) }}
  <hr class="zine-rule zine-rule--solid">
  {{ partial "page_footer.html" . }}
{{ end }}
