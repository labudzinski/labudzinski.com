{{ define "main" }}
  {{ partial "section_cmd.html" (dict "title" (.Title | lower) "cmd" "ls" "arg" (printf "/%s/" (.Title | urlize)) "level" "h1") }}
  <hr class="zine-rule zine-rule--solid">
  <ul class="menu-list">
    {{- range .Pages -}}
      <li><a href="{{ .Permalink | relURL }}">{{ .Title }}</a></li>
    {{- end -}}
  </ul>
  {{ partial "page_footer.html" . }}
{{ end }}
