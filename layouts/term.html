{{ define "main" }}
  <h1 class="visually-hidden">{{ .Title }}</h1>
  <section class="page-section" aria-labelledby="section-{{ .Title | urlize }}">
    {{ partial "section_head.html" (dict "title" .Title "id" (printf "section-%s" (.Title | urlize))) }}
    {{ partial "post_list_term.html" . }}
    <hr class="zine-rule zine-rule--solid">
  </section>
  {{ partial "page_footer.html" . }}
{{ end }}
