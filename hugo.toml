baseURL = 'https://labudzinski.com/'
defaultContentLanguage = 'pl'
defaultContentLanguageInSubdir = false
languageCode = 'pl-PL'
title = 'Dominik Labudzinski'
enableRobotsTXT = true
enableGitInfo = true
summaryLength = 55

[frontmatter]
  lastmod = ['lastmod', 'date']

[languages.pl]
languageCode = 'pl-PL'
languageName = 'Polski'
locale = 'pl-PL'
weight = 1
title = 'Dominik Labudzinski'

# Prepared for future multilingual expansion (disabled until content exists).
[languages.en]
languageCode = 'en-US'
languageName = 'English'
locale = 'en-US'
weight = 2
title = 'Dominik Labudzinski'
disabled = true

[services]
  [services.googleAnalytics]
    id = 'G-2YG1GB25SM'

[module]
  [module.hugoVersion]
    min = '0.146.0'

  [[module.mounts]]
    source = 'content'
    target = 'content'

  [[module.mounts]]
    source = 'static'
    target = 'static'

  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'

  [[module.mounts]]
    source = 'data'
    target = 'data'

  [[module.mounts]]
    source = 'archetypes'
    target = 'archetypes'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = false
    style = 'monokai'
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[mediaTypes]
  [mediaTypes.'text/plain']
    suffixes = ['txt']

[outputFormats]
  [outputFormats.LLMS]
    mediaType = 'text/plain'
    baseName = 'llms'
    isPlainText = true
    notAlternative = true

[outputs]
  home = ['HTML', 'RSS', 'LLMS']
  page = ['HTML']
  section = ['HTML']
  taxonomy = ['HTML']
  term = ['HTML']

[params]
  author = 'Dominik Labudzinski'
  pgp_author = 'Dominik Labudzinski'
  copyright_start = 2019
  description = 'Blog o architekturze oprogramowania, bezpieczeństwie, DevOps i bazach danych.'
  home_title = 'Dominik Labudzinski — architektura, bezpieczeństwo, DevOps'
  bio = 'DevOps / Software Architect / Software Engineer / Database Architect / Security Engineer'
  date_format = '2006-01-02'
  back_home_text = '← blog'
  github = 'https://github.com/labudzinski'
  linkedin = 'https://www.linkedin.com/in/dominik-l/'
  twitter = '@labudzinski'
  og_image = '/images/og-default.png'
  site_type = 'Person'
  job_title = 'Software Architect'
  ai_training_allowed = false
  indexnow_key = '8f4c2a91e6b07d3f5c1a9e8b4d6f0c2a'

  [params.giscus]
    repo = 'labudzinski/labudzinski.com'
    repoId = 'MDEwOlJlcG9zaXRvcnkxNzYyOTE5MjQ='
    category = 'Post'
    categoryId = 'DIC_kwDOCoIAVM4DArv2'
    mapping = 'pathname'
    strict = '0'
    reactionsEnabled = '1'
    emitMetadata = '0'
    inputPosition = 'bottom'
    theme = 'dark'
    lang = 'pl'

[taxonomies]
  tag = 'tags'

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[[cascade]]
  [cascade.params]
    noindex = true
  [cascade.sitemap]
    disable = true
  [cascade.target]
    kind = 'term'

[[cascade]]
  [cascade.params]
    noindex = true
  [cascade.sitemap]
    disable = true
  [cascade.target]
    kind = 'taxonomy'

[[cascade]]
  [cascade.sitemap]
    changefreq = 'monthly'
    priority = 0.8
  [cascade.target]
    kind = 'page'
    path = '/posts/**'

[[cascade]]
  [cascade.sitemap]
    changefreq = 'weekly'
    priority = 1.0
  [cascade.target]
    kind = 'home'

[pagination]
  pagerSize = 20
