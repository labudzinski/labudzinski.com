baseURL = 'https://labudzinski.com/'
defaultContentLanguage = 'pl'
defaultContentLanguageInSubdir = false
languageCode = 'pl-PL'
title = 'Dominik Labudzinski'
enableRobotsTXT = true
enableGitInfo = true
summaryLength = 40

[languages.pl]
languageCode = 'pl-PL'
languageName = 'Polski'
locale = 'pl-PL'
weight = 1
title = 'Dominik Labudzinski'

# Prepared for future multilingual expansion (disabled until content exists).
[languages.en]
languageCode = 'en-US'
languageName = 'English'
locale = 'en-US'
weight = 2
title = 'Dominik Labudzinski'
disabled = true

[services]
  [services.disqus]
    shortname = 'labudzinskicom'

  [services.googleAnalytics]
    id = 'G-2YG1GB25SM'

[module]
  [module.hugoVersion]
    min = '0.146.0'

  [[module.mounts]]
    source = 'content'
    target = 'content'

  [[module.mounts]]
    source = 'static'
    target = 'static'

  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'

  [[module.mounts]]
    source = 'data'
    target = 'data'

  [[module.mounts]]
    source = 'archetypes'
    target = 'archetypes'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = false
    style = 'monokai'
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[mediaTypes]
  [mediaTypes.'text/plain']
    suffixes = ['txt']

[outputFormats]
  [outputFormats.LLMS]
    mediaType = 'text/plain'
    baseName = 'llms'
    isPlainText = true
    notAlternative = true
  [outputFormats.LLMSFull]
    mediaType = 'text/plain'
    baseName = 'llms-full'
    isPlainText = true
    notAlternative = true

[outputs]
  home = ['HTML', 'RSS', 'LLMS', 'LLMSFull']
  page = ['HTML']
  section = ['HTML']
  taxonomy = ['HTML']
  term = ['HTML']

[params]
  author = 'Dominik Labudzinski'
  pgp_author = 'Dominik Labudzinski'
  copyright_start = 2019
  description = 'DevOps / Software Architect / Software Engineer / Database Architect / Security Engineer'
  date_format = '2006-01-02'
  back_home_text = 'back'
  github = 'https://github.com/labudzinski'
  linkedin = 'https://www.linkedin.com/in/dominik-l/'
  twitter = '@labudzinski'
  og_image = '/images/og-default.svg'
  site_type = 'Person'
  job_title = 'Software Architect'
  ai_training_allowed = false

[taxonomies]
  tag = 'tags'

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[pagination]
  pagerSize = 20
