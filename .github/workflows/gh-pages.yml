name: GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Sign posts
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          if [ -z "$PGP_PRIVATE_KEY" ]; then
            echo "PGP_PRIVATE_KEY not set, skipping post signing"
            exit 0
          fi
          echo "$PGP_PRIVATE_KEY" | gpg --batch --import
          go run ./cmd/signposts --repo .

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.3'
          extended: true

      - name: Build
        run: hugo --minify --gc

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      - name: Commit signed posts
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
        run: |
          if [ -z "$PGP_PRIVATE_KEY" ]; then
            echo "PGP_PRIVATE_KEY not set, skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts/
          if git diff --staged --quiet; then
            echo "No signature changes to commit"
          else
            git commit -m "chore: update PGP post signatures [skip ci]"
            git push
          fi
